name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tokens]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: python -m mypy
      - name: Tests (pytest)
        run: pytest --cov --cov-report=term --cov-fail-under=90
      - name: Nine-check lifecycle
        run: contextctl selfcheck
      - name: Replay determinism (synthetic, 3 repeats)
        run: contextctl replay --repeats 3 --quiet --out replay.json

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (production config)
        run: python site/build.py
      - name: Check site output
        run: |
          test -f site/dist/index.html
          test -f site/dist/paper/contextctl_AAIBD2026.pdf
          grep -q 'rel="canonical" href="https://contextctl.sh/"' site/dist/index.html
          ! grep -q '{{' site/dist/index.html

  deploy:
    needs: [test, site]
    runs-on: ubuntu-latest
    # Fork PRs get no secrets; skip them instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17
      - name: Build site
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python site/build.py                 # production: indexable
          else
            INDEXABLE=0 python site/build.py     # PR drafts: noindex
          fi
      - name: Deploy to Netlify
        id: deploy
        run: |
          set -euo pipefail
          MSG="${GITHUB_SHA::7} ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS=(--prod)
          else
            ARGS=(--alias "pr-${{ github.event.number }}")
          fi
          # The Netlify API occasionally returns a transient "Site not found"; retry.
          for attempt in 1 2 3; do
            if OUT=$(netlify deploy "${ARGS[@]}" --dir site/dist --site "$NETLIFY_SITE_ID" --message "$MSG" --json); then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "deploy attempt $attempt failed; retrying in 15s"; sleep 15
          done
          URL=$(echo "$OUT" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("url") if "--prod" in sys.argv else d["deploy_url"])' "${ARGS[0]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        if: github.event_name == 'push'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' https://contextctl.netlify.app/) && [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ]
          curl -sfL https://contextctl.netlify.app/paper/contextctl_AAIBD2026.pdf -o /dev/null
