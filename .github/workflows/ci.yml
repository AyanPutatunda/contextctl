name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tokens]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: python -m mypy
      - name: Tests (pytest)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          pytest --cov --cov-report=term --cov-fail-under=90
      - name: Nine-check lifecycle
        run: contextctl selfcheck
      - name: Replay determinism (synthetic, 3 repeats)
        run: contextctl replay --repeats 3 --quiet --out replay.json

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python site/build.py
      - name: Check site output
        run: |
          test -f site/dist/index.html
          test -f site/dist/paper/contextctl_AAIBD2026.pdf
          grep -q 'noindex' site/dist/index.html
          grep -q 'Disallow: /' site/dist/robots.txt
          ! grep -q '{{' site/dist/index.html
